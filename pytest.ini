[pytest]
pythonpath = src tools
testpaths = tests
markers =
    caso(id): identificador del caso de prueba (TEST-xx) definido en docs/H3/casos_de_prueba.md
    req(*ids): requisitos de H1 v0.2 que verifica la prueba (RF-01, RS-01...)
    esc(*ids): escenarios de H1 v0.2 que ejerce la prueba (ESC-01...)
    nivel(n): nivel de prueba sin robot (1 interpretación, 2 lógica, 3 interfaz hacia el robot)
