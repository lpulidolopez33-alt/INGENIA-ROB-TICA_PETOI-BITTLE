name: Pruebas Bittle Python

on:
  pull_request:
  push:
    branches:
      - feature/bittle-voice-fifo-20261112
      - feature/chatgpt-github-bluetooth-20261112
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Ejecutar pruebas sin hardware
        run: python -m pytest -q
